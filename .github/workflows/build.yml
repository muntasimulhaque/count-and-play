name: Build signed Android release

on:
  push:
    branches: [main]
    # Only rebuild when something that affects the app actually changes,
    # so doc-only commits (README, play-store assets) don't burn a build.
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "tools/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

# Read-only at workflow level; the publish job below is granted write only.
permissions:
  contents: read

concurrency:
  group: build-main
  # Never cancel a run that may already be publishing the release.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      - name: Run unit tests and lint
        # Pure-JVM game-logic + language-pack tests (no device needed), plus
        # full lint so non-fatal findings surface instead of hiding forever.
        # :tools:checkSounds pins the sound assets to their generator: any
        # hand edit or drift fails CI before it can ride into a release.
        run: ./gradlew :app:testReleaseUnitTest :app:lintRelease :tools:checkSounds

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret not set; refusing to publish an unsigned AAB."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/signing.keystore

      - name: Build release AAB and APK
        env:
          KEYSTORE_FILE: signing.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease

      - name: Verify signing certificate
        run: keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -A2 "SHA256"

      - name: Upload AAB (for Play Console)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: count-and-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK (for direct install / testing)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: count-and-play-apk
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 30

      - name: Publish AAB + APK to the "latest-build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/apk/release/app-release.apk \
            --title "Latest CI build" \
            --notes "Automated signed build of commit ${GITHUB_SHA}" \
            --prerelease

      - name: Push outputs to the 'builds' branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/builds
          cp app/build/outputs/bundle/release/app-release.aab /tmp/builds/
          cp app/build/outputs/apk/release/app-release.apk /tmp/builds/
          cd /tmp/builds
          git init -b builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build outputs for ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
