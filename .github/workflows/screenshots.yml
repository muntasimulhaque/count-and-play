name: Capture store screenshots

# Renders REAL Play Store screenshots from the app's Compose UI on an Android
# emulator, so the store listing always matches the shipped build (the old
# screenshots were PIL-drawn approximations). Runs on GitHub's servers.
#
# Trigger manually, or automatically when the UI or the capture test changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/src/main/**"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: read

concurrency:
  group: screenshots-main
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Play Store form factors: phone (16:9-ish), 7" and 10" tablets.
        include:
          - name: phone
            profile: pixel_2        # 1080x1920 (1.78:1), Play-safe
          - name: tablet7
            profile: Nexus 7        # 1200x1920, 7-inch
          - name: tablet10
            profile: pixel_c        # 2560x1800, 10-inch
    env:
      API_LEVEL: 34
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      # Hardware acceleration for the emulator on the GitHub runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The AVD and its snapshot are expensive to cold-create; cache them per
      # form factor so only the first leg pays for it.
      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ matrix.profile }}

      - name: Create AVD and generate a snapshot to cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: echo "Generated AVD snapshot."

      - name: Run screenshot capture on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            # AGP copies the test's additional output off-device (before it
            # uninstalls the app) into app/build/outputs/.../additional output.
            echo "All PNGs under app/build/outputs (diagnostic):"
            find app/build/outputs -type f -name '*.png' -print
            mkdir -p store-shots
            find app/build/outputs/connected_android_test_additional_output -type f -name '*.png' -exec cp {} store-shots/ ';'
            # Prefix every PNG with the form factor so per-leg artifacts never collide.
            # (Single line: the emulator-runner feeds the script to sh, which chokes
            # on multi-line compound commands.)
            for f in store-shots/*.png; do mv "$f" "store-shots/${{ matrix.name }}_$(basename "$f")"; done
            echo "Collected:"
            ls -la store-shots
            # Fail loudly if nothing was captured, rather than a false green.
            test "$(ls store-shots/*.png 2>/dev/null | wc -l)" -ge 1

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-screenshots-${{ matrix.name }}
          path: store-shots/**
          if-no-files-found: warn
