name: Probe available system images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List android 34+ system images
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list > /tmp/all.txt || true
          grep -E "system-images;android-3[4-9]" /tmp/all.txt | head -50
          echo "=== canary/beta channel ==="
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list --channel=3 > /tmp/all2.txt || true
          grep -E "system-images;android-37" /tmp/all2.txt | head -30 || true
