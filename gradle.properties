org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# AGP 9 defaults to generating unit tests only for the debug build type; CI
# gates the release build, so keep the release unit-test task (testReleaseUnitTest).
android.onlyEnableUnitTestForTheTestedBuildType=false
